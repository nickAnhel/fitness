services:
  server:
    container_name: server
    restart: on-failure
    command: bash -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    build:
      dockerfile: ./Dockerfile
    ports:
      - 8000:8000
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./alembic.ini:/app/alembic.ini
      - ./.env:/app/.env
    env_file:
      - ./.env
    depends_on:
      - db

  db:
    container_name: db
    image: postgres:latest
    restart: on-failure
    ports:
      - 5432:5432
    env_file:
      - ./.postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    ports:
      - 5050:80
    env_file:
      - ./.postgres-env
    depends_on:
      - db

volumes:
  postgres_data: