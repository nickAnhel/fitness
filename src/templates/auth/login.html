{% extends "base.html" %}
{% block content %}
<section class="card card--narrow">
    <p class="eyebrow">Вход</p>
    <h1 class="heading">Войти в аккаунт</h1>
    <p class="text-muted">Введите логин и пароль, чтобы продолжить</p>
    <form class="form" method="post" action="/login">
        <label class="field">
            <span class="field__label">Логин</span>
            <input type="text" name="login" placeholder="Ваш логин" required>
        </label>
        <label class="field">
            <span class="field__label">Пароль</span>
            <input type="password" name="password" placeholder="••••••••" required>
        </label>
        <div class="form__actions">
            <button class="btn btn--primary" type="submit">Войти</button>
            <a class="btn btn--ghost" href="{{ url_for('register_page') }}">Создать аккаунт</a>
        </div>
    </form>
</section>
{% endblock %}
