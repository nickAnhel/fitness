<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Сеть фитнес-клубов</title>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body class="page">
<div class="layout">
    <header class="layout__header">
        <div class="logo">FIT</div>
        <div class="site-title">
            <div class="site-title__caption">Сеть фитнес-клубов</div>
            <div class="site-title__subtitle">Движение. Энергия. Результат.</div>
        </div>
        <div class="header-actions">
            <button class="btn btn--ghost theme-toggle" type="button" id="theme-toggle-btn" aria-pressed="false">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <line x1="12" y1="2" x2="12" y2="4"></line>
                    <line x1="12" y1="20" x2="12" y2="22"></line>
                    <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
                    <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
                    <line x1="2" y1="12" x2="4" y2="12"></line>
                    <line x1="20" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
                    <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span class="sr-only">Переключить тему</span>
            </button>
            {% if request.state.user %}
                <div class="auth-inline">
                    <a class="btn btn--ghost" href="{{ url_for('profile_page') }}">Профиль</a>
                    <form method="post" action="{{ url_for('logout') }}">
                        <button class="btn btn--primary" type="submit">Выход</button>
                    </form>
                </div>
            {% else %}
                <div class="auth-inline">
                    <a class="btn btn--ghost" href="{{ url_for('login_page') }}">Войти</a>
                    <a class="btn btn--primary" href="{{ url_for('register_page') }}">Регистрация</a>
                </div>
            {% endif %}
        </div>
    </header>

    <div class="layout__body">
        {% set current_path = request.url.path %}
        <nav class="sidebar">
            <div class="sidebar__section">
                <div class="sidebar__title">Навигация</div>
                <a class="sidebar__link {% if current_path == '/about' %}sidebar__link--active{% endif %}" href="{{ url_for('about') }}">О сети</a>
                <a class="sidebar__link {% if current_path.startswith('/branches') %}sidebar__link--active{% endif %}" href="{{ url_for('list_branches') }}">Филиалы</a>
                <a class="sidebar__link {% if current_path.startswith('/tariffs') %}sidebar__link--active{% endif %}" href="{{ url_for('list_tariffs') }}">Тарифы</a>
                <a class="sidebar__link {% if current_path.startswith('/promotions') %}sidebar__link--active{% endif %}" href="{{ url_for('list_promotions') }}">Промо-акции</a>
            </div>
        </nav>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script>
    (function () {
        const storageKey = 'theme';
        const root = document.documentElement;
        const btn = document.getElementById('theme-toggle-btn');

        function currentTheme() {
            return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        }

        function updateState(theme) {
            if (!btn) return;
            const isDark = theme === 'dark';
            btn.classList.toggle('is-dark', isDark);
            btn.setAttribute('aria-pressed', String(isDark));
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                root.setAttribute('data-theme', 'dark');
            } else {
                root.removeAttribute('data-theme');
                theme = 'light';
            }
            try {
                localStorage.setItem(storageKey, theme);
            } catch (_) {}
            updateState(theme);
        }

        if (btn) {
            updateState(currentTheme());
            btn.addEventListener('click', () => {
                const next = currentTheme() === 'dark' ? 'light' : 'dark';
                applyTheme(next);
            });
        }
    })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
